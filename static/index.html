<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Informtit</title>
  <link rel="stylesheet" href="/style.css?v=4.3">
  <link rel="stylesheet" href="/assets-ui.css?v=1.0">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">IT</div>
        <div>
          <strong>Informtit</strong>
          <span>Informes de titulación</span>
        </div>
      </div>
      <nav>
        <button class="nav-item active" data-view="dashboard">Inicio</button>
        <button class="nav-item" data-view="reports">Informes</button>
      </nav>
      <div class="sidebar-footer">
        <span>ITSQMET</span>
        <small>Unidad de Titulación</small>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="page-title">Inicio</h1>
          <p id="page-subtitle">Gestione períodos, módulos y documentos institucionales.</p>
        </div>
        <div class="topbar-actions">
          <button class="button secondary" id="refresh-app" type="button">Actualizar</button>
        </div>
      </header>

      <section id="view-dashboard" class="view active">
        <div class="metrics" id="dashboard-metrics"></div>
        <section class="panel">
          <div class="panel-head">
            <div>
              <h2>Períodos académicos</h2>
              <p>Abra un período para trabajar con sus datos.</p>
            </div>
            <button class="button primary" id="new-report">Nuevo período</button>
          </div>
          <div id="reports-grid" class="reports-grid"></div>
        </section>
      </section>

      <section id="view-reports" class="view">
        <section class="panel">
          <div class="panel-head">
            <div>
              <h2>Todos los informes</h2>
              <p>Listado general de períodos registrados.</p>
            </div>
            <button class="button primary" id="new-report-list">Nuevo período</button>
          </div>
          <div id="reports-list"></div>
        </section>
      </section>

      <section id="view-report" class="view">
        <div id="report-workspace">
          <div class="report-banner">
            <div>
              <span class="eyebrow" id="report-modality"></span>
              <h2 id="report-name"></h2>
              <p id="report-period"></p>
            </div>
            <div class="report-actions">
              <a class="button secondary" id="export-pdf" target="_blank">Generar PDF</a>
            </div>
          </div>

          <div id="report-tabs" class="tabs">
            <button class="tab active" data-tab="general">Datos generales</button>
            <button class="tab" data-tab="careers">Complexivo</button>
            <button class="tab" data-tab="nuclei">Núcleos</button>
            <button class="tab" data-tab="schedules">Cronogramas</button>
            <button class="tab" data-tab="projects">Trabajo de Titulación</button>
            <button class="tab" data-tab="completion">Cierre</button>
            <button class="tab" data-tab="assets">Recursos</button>
            <button class="tab" data-tab="sections">Secciones</button>
          </div>

          <div id="tab-general" class="tab-content active"></div>
          <div id="tab-careers" class="tab-content"></div>
          <div id="tab-nuclei" class="tab-content"></div>
          <div id="tab-schedules" class="tab-content"></div>
          <div id="tab-projects" class="tab-content"></div>
          <div id="tab-completion" class="tab-content"></div>
          <div id="tab-assets" class="tab-content"></div>
          <div id="tab-sections" class="tab-content"></div>
        </div>
      </section>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root"></div>

  <script src="/app.js?v=4.3"></script>
  <script src="/forms-hotfix.js?v=4.3"></script>
  <script src="/process-ui.js?v=4.3"></script>
  <script src="/process-independent-ui.js?v=4.3"></script>
  <script src="/process-ui-fixes.js?v=4.3"></script>
  <script src="/project-search.js?v=4.3"></script>
  <script src="/report-structure-ui.js?v=4.3"></script>
  <script src="/independent-modules-ui.js?v=4.3"></script>
  <script src="/nuclei-ui.js?v=4.3"></script>
  <script src="/nuclei-course-editor.js?v=4.3"></script>
  <script src="/nuclei-matching-ui.js?v=4.3"></script>
  <script src="/nuclei-minimal-guard.js?v=4.3"></script>
  <script src="/nuclei-catalog-ui.js?v=4.3"></script>
  <script src="/nuclei-organization.js?v=4.3"></script>
  <script src="/nuclei-clarity.js?v=4.3"></script>
  <script src="/nuclei-campus-ui.js?v=4.3"></script>
  <script src="/workflow-ui.js?v=4.3"></script>
  <script src="/workflow-ui-fixes.js?v=4.3"></script>
  <script src="/completion-ui.js?v=4.3"></script>
  <script src="/completion-ui-v2.js?v=4.3"></script>
  <script src="/thesis-followup-ui.js?v=4.3"></script>
  <script src="/thesis-full-ui.js?v=4.3"></script>
  <script src="/pdf-validation-ui.js?v=4.3"></script>
  <script src="/period-unified-ui.js?v=4.3"></script>
  <script src="/import-modality-guard-ui.js?v=4.3"></script>
  <script src="/import-preview-client-guard.js?v=4.3"></script>
  <script src="/robust-import-ui.js?v=4.3"></script>
  <script src="/pdf-progress.js?v=4.3"></script>
  <script src="/coordinator-admin-ui.js?v=4.3"></script>
  <script src="/assets-ui.js?v=1.0"></script>
  <script src="/no-sections.js?v=4.3"></script>
  <script src="/firebase-ui.js?v=1.0"></script>
  <script src="/startup-guard.js?v=4.3"></script>
  <script src="/desktop-ui-rescue.js?v=4.3"></script>
</body>
</html>
