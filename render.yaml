services:
  - type: web
    name: informtit-api
    runtime: docker
    plan: starter
    branch: main
    autoDeploy: true
    envVars:
      - key: INFORMTIT_ALLOWED_ORIGINS
        value: https://jeffer91.github.io
      - key: HOST
        value: 0.0.0.0
    disk:
      name: informtit-data
      mountPath: /var/data
      sizeGB: 1
    dockerCommand: >-
      /bin/sh -c 'mkdir -p /var/data/uploads /var/data/exports;
      rm -f /app/data/informtit.db;
      ln -s /var/data/informtit.db /app/data/informtit.db;
      rm -rf /app/uploads /app/exports;
      ln -s /var/data/uploads /app/uploads;
      ln -s /var/data/exports /app/exports;
      exec python web_entry.py'
