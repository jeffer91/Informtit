name: Informtit tests

on:
  push:
    branches: [main, independent-modules-hardening]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile app.py db.py parser.py analytics.py import_service.py requirements_store.py roster_service.py workflow_rules.py workflow_report_runtime.py workflow_report_fixes.py eligibility_runtime_fixes.py process_service.py thesis_independent.py process_routes.py process_export.py optional_content.py report_structure.py report_quality.py report_quality_runtime.py report_completion.py report_completion_constants.py report_completion_fixes.py report_completion_runtime.py report_decoupled.py report_enhancements.py report_catalog_independent.py report_final_overhaul.py report_full_detail.py report_pdf_polish.py report_pdf_guard.py report_schedule_truth.py report_table_style.py completion_service.py completion_routes.py eligibility_service.py thesis_followup.py coordinator_registry.py nuclei_service.py nuclei_multicampus.py nuclei_multicampus_report.py nuclei_excel_import.py nuclei_excel_report.py nuclei_matching_report.py nuclei_matching_routes.py nuclei_multicampus_workflow.py nuclei_routes.py nuclei_course_edit.py nuclei_export.py nuclei_fixes.py nuclei_catalog.py nuclei_catalog_export.py pdf_only_runtime.py pdf_validation_runtime.py pdf_progress_runtime.py dual_modality_runtime.py period_policy_runtime.py period_unified_runtime.py period_import_guard.py firebase_sync_runtime.py firebase_catalog_runtime.py firebase_integrity_runtime.py storage_migration.py report_integrity_core.py report_integrity_overrides.py report_integrity_hooks.py report_integrity_pdf.py report_integrity_requirements.py report_integrity_rules.py report_integrity_final_fixes.py report_integrity_runtime.py report_integrity_last_guard.py report_integrity_ishikawa.py desktop_entry.py desktop_launcher.py layout_v2.py layout_v3.py
      - run: node --check electron/main.cjs
      - run: node --check electron/main2.cjs
      - run: node --check static/app.js
      - run: node --check static/assets-ui.js
      - run: node --check static/no-sections.js
      - run: node --check static/process-ui.js
      - run: node --check static/process-independent-ui.js
      - run: node --check static/process-ui-fixes.js
      - run: node --check static/project-search.js
      - run: node --check static/report-structure-ui.js
      - run: node --check static/independent-modules-ui.js
      - run: node --check static/nuclei-ui.js
      - run: node --check static/nuclei-course-editor.js
      - run: node --check static/nuclei-matching-ui.js
      - run: node --check static/nuclei-minimal-guard.js
      - run: node --check static/nuclei-catalog-ui.js
      - run: node --check static/nuclei-organization.js
      - run: node --check static/nuclei-clarity.js
      - run: node --check static/nuclei-campus-ui.js
      - run: node --check static/workflow-ui.js
      - run: node --check static/workflow-ui-fixes.js
      - run: node --check static/completion-ui.js
      - run: node --check static/completion-ui-v2.js
      - run: node --check static/thesis-followup-ui.js
      - run: node --check static/thesis-full-ui.js
      - run: node --check static/pdf-validation-ui.js
      - run: node --check static/period-unified-ui.js
      - run: node --check static/import-modality-guard-ui.js
      - run: node --check static/pdf-progress.js
      - run: node --check static/firebase-ui.js
      - run: node -e "const p=require('./package.json'); if(p.main!=='electron/main.cjs') process.exit(1)"
      - run: python -m unittest discover -s tests -v

# Verificación directa de integridad sobre main.
