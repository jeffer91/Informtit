name: Informtit tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile app.py db.py parser.py import_service.py roster_service.py process_service.py process_routes.py process_export.py desktop_entry.py layout_v2.py layout_v3.py
      - run: python -m unittest discover -s tests -v
