name: Deploy Informtit to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: informtit-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate GitHub Pages runtimes
        run: |
          node --check static/web-runtime.js
          node --check static/firebase-pages-runtime.js
          node --check static/firebase-report-pages-runtime.js
          node --check static/firebase-report-code-runtime.js
          node --check static/firebase-active-report-runtime.js
          node --check static/firebase-unified-data-runtime.js
          node --check static/firebase-global-period-runtime.js
          node --check static/firebase-nuclei-paste-runtime.js
          node --check static/nuclei-paste-course-detection-fix.js
          node --check static/firebase-nuclei-definitive-runtime.js
          node --check static/firebase-global-period-final-ui.js
          node --check static/firebase-schedule-runtime.js
          node --check static/firebase-schedule-completion-runtime.js
          node --check static/schedule-auto-completion-ui.js
          node --check static/report-health-ui.js
          node --check static/nuclei-paste-ui.js
          node --check static/nuclei-paste-definitive-ui.js
          node --check static/github-pages-runtime-fixes.js
          node --check static/firebase-period-selector-ui.js
          node --check static/unified-period-ui.js
          node --check static/github-pages-guard.js

      - name: Prepare GitHub Pages site
        env:
          INFORMTIT_API_BASE: ${{ vars.INFORMTIT_API_BASE }}
        run: |
          rm -rf _site
          mkdir -p _site
          cp -a static/. _site/
          touch _site/.nojekyll
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          site = Path('_site')
          index = site / 'index.html'
          text = index.read_text(encoding='utf-8')

          text = re.sub(r'(href|src)="/', r'\1="./', text)

          bridge = (
              '  <script src="./web-config.js?v=1.0"></script>\n'
              '  <script src="./web-runtime.js?v=1.0"></script>\n'
              '  <script src="./firebase-pages-runtime.js?v=1.0"></script>\n'
              '  <script src="./firebase-report-pages-runtime.js?v=2.0"></script>\n'
              '  <script src="./firebase-report-code-runtime.js?v=2.0"></script>\n'
              '  <script src="./firebase-active-report-runtime.js?v=1.0"></script>\n'
              '  <script src="./firebase-unified-data-runtime.js?v=1.0"></script>\n'
              '  <script src="./firebase-global-period-runtime.js?v=1.0"></script>\n'
              '  <script src="./firebase-nuclei-paste-runtime.js?v=1.0"></script>\n'
              '  <script src="./nuclei-paste-course-detection-fix.js?v=1.0"></script>\n'
              '  <script src="./firebase-nuclei-definitive-runtime.js?v=1.0"></script>\n'
              '  <script src="./firebase-schedule-runtime.js?v=1.2"></script>\n'
              '  <script src="./firebase-schedule-completion-runtime.js?v=1.0"></script>\n'
              '  <script src="./github-pages-runtime-fixes.js?v=1.0"></script>\n'
              '  <script src="./github-pages-guard.js?v=1.3"></script>\n'
          )
          app_script = '  <script src="./app.js?v=4.6"></script>\n'
          after_app = (
              '  <script src="./unified-period-ui.js?v=1.0"></script>\n'
              '  <script src="./firebase-period-selector-ui.js?v=1.3"></script>\n'
          )
          if 'firebase-nuclei-definitive-runtime.js?v=1.0' not in text:
              text = text.replace(app_script, bridge + app_script + after_app)
          elif 'unified-period-ui.js?v=1.0' not in text:
              text = text.replace(app_script, app_script + after_app)

          final_ui = (
              '  <script src="./firebase-global-period-final-ui.js?v=1.0"></script>\n'
              '  <script src="./schedule-auto-completion-ui.js?v=1.0"></script>\n'
              '  <script src="./report-health-ui.js?v=1.0"></script>\n'
              '  <script src="./nuclei-paste-ui.js?v=1.0"></script>\n'
              '  <script src="./nuclei-paste-definitive-ui.js?v=1.0"></script>\n'
          )
          if 'nuclei-paste-definitive-ui.js?v=1.0' not in text:
              text = text.replace('</body>', final_ui + '</body>')

          index.write_text(text, encoding='utf-8')

          api_base = os.environ.get('INFORMTIT_API_BASE', '').strip().rstrip('/')
          (site / 'web-config.js').write_text(
              'window.INFORMTIT_API_BASE = ' + json.dumps(api_base) + ';\n',
              encoding='utf-8',
          )
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
