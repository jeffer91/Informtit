name: Deploy Informtit to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate JavaScript
        run: |
          set -e
          for file in static/*.js; do
            node --check "$file"
          done

      - name: Prepare GitHub Pages site
        run: |
          rm -rf _site
          cp -R static _site
          python - <<'PY'
          from pathlib import Path
          import re

          index = Path('_site/index.html')
          text = index.read_text(encoding='utf-8')

          # GitHub Pages sirve desde una subruta: convertir recursos raíz a relativos.
          text = re.sub(r'(?P<attr>href|src)="/(?!/)(?P<path>[^"]+)"', r'\g<attr>="./\g<path>"', text)

          # Estos módulos pertenecen al escritorio/backend local o al runtime Firebase
          # anterior. No deben ejecutarse en la versión GitHub Pages + Google Sheets.
          remove_scripts = {
              'startup-guard.js',
              'forms-hotfix.js',
              'import-modality-guard-ui.js',
              'import-preview-client-guard.js',
              'robust-import-ui.js',
              'period-unified-ui.js',
              'students-period-ui.js',
              'students-final-audit-ui.js',
              'smart-reconciliation-ui.js',
              'firebase-ui.js',
              'desktop-ui-rescue.js',
          }
          for script in remove_scripts:
              text = re.sub(rf'\s*<script[^>]+src="[^\"]*{re.escape(script)}[^\"]*"[^>]*></script>', '', text, flags=re.I)

          app_tag = re.search(r'<script[^>]+src="\.\/app\.js[^\"]*"[^>]*></script>', text, flags=re.I)
          if not app_tag:
              raise SystemExit('No se encontró app.js en index.html')

          before_app = '''
          <script src="./sheets-api.js?v=3.0"></script>
          <script src="./firebase-report-pages-runtime.js?v=3.0"></script>
          <script src="./firebase-report-code-runtime.js?v=3.0"></script>
          <script src="./pages-data-runtime.js?v=3.0"></script>
          <script src="./nuclei-career-runtime.js?v=3.0"></script>
          '''
          text = text[:app_tag.start()] + before_app + text[app_tag.start():]

          after_app = '''
          <script src="./pages-period-selector-ui.js?v=3.0"></script>
          <script src="./requirements-import-sheets-ui.js?v=3.0"></script>
          <script src="./results-import-ui.js?v=3.0"></script>
          <script src="./schedule-auto-completion-ui.js?v=3.0"></script>
          <script src="./nuclei-paste-definitive-ui.js?v=3.0"></script>
          <script src="./nuclei-population-ui.js?v=3.0"></script>
          <script src="./nuclei-organization.js?v=3.0"></script>
          <script src="./pvc-schedules-ui.js?v=3.0"></script>
          <script src="./report-health-sheets-ui.js?v=3.0"></script>
          <script src="./pvc-workspace-v3.js?v=3.0"></script>
          <script src="./pages-system-ui.js?v=3.0"></script>
          '''
          app_tag = re.search(r'<script[^>]+src="\.\/app\.js[^\"]*"[^>]*></script>', text, flags=re.I)
          text = text[:app_tag.end()] + after_app + text[app_tag.end():]

          index.write_text(text, encoding='utf-8')
          PY

      - name: Verify clean Pages bundle
        run: |
          set -e
          grep -q 'sheets-api.js' _site/index.html
          grep -q 'pages-data-runtime.js' _site/index.html
          grep -q 'requirements-import-sheets-ui.js' _site/index.html
          grep -q 'pvc-workspace-v3.js' _site/index.html
          ! grep -q 'import-preview-client-guard.js' _site/index.html
          ! grep -q 'robust-import-ui.js' _site/index.html
          ! grep -q 'firebase-global-period-runtime.js' _site/index.html
          ! grep -q 'firebase-pages-runtime.js' _site/index.html
          ! grep -q 'firebase-schedule-runtime.js' _site/index.html
          ! grep -q 'firebase-period-selector-ui.js' _site/index.html
          ! grep -q 'web-runtime.js' _site/index.html
          ! grep -q 'desktop-ui-rescue.js' _site/index.html
          node --check _site/pages-data-runtime.js
          node --check _site/pages-period-selector-ui.js
          node --check _site/requirements-import-sheets-ui.js
          node --check _site/pvc-workspace-v3.js
          node --check _site/pages-system-ui.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
