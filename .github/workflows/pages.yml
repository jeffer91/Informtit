name: Deploy Informtit to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: informtit-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate shared frontend
        run: |
          node --check electron/main.cjs
          node --check electron/preload.cjs
          for file in static/*.js; do
            node --check "$file"
          done

      - name: Verify shared backend parity
        env:
          INFORMTIT_API_BASE: ${{ vars.INFORMTIT_API_BASE }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request
          from pathlib import Path
          from urllib.parse import urlparse

          api_base = os.environ.get('INFORMTIT_API_BASE', '').strip().rstrip('/')
          if not api_base:
              raise SystemExit(
                  'INFORMTIT_API_BASE no está configurada. GitHub Pages no se desplegará en modo reducido: '
                  'debe usar el mismo backend de Informtit que npm start.'
              )

          parsed = urlparse(api_base)
          if parsed.scheme != 'https' or not parsed.netloc:
              raise SystemExit('INFORMTIT_API_BASE debe ser una URL pública HTTPS válida.')

          version = json.loads(Path('package.json').read_text(encoding='utf-8'))['version']

          def get_json(path: str):
              request = urllib.request.Request(
                  f'{api_base}{path}',
                  headers={'Accept': 'application/json', 'User-Agent': 'Informtit-Pages-Parity'},
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  if response.status < 200 or response.status >= 300:
                      raise RuntimeError(f'HTTP {response.status}')
                  return json.loads(response.read().decode('utf-8'))

          deadline = time.time() + 600
          last_detail = 'backend todavía no comprobado'
          while time.time() < deadline:
              try:
                  health = get_json('/api/health')
                  runtime = get_json('/api/runtime-info')
                  capabilities = set(health.get('capabilities') or [])
                  build = str(runtime.get('build') or '').strip()
                  if (
                      health.get('ok') is True
                      and 'schedules' in capabilities
                      and runtime.get('ok') is True
                      and build == version
                  ):
                      print(f'Paridad confirmada: Informtit {version} · {api_base}')
                      break
                  last_detail = (
                      f'health.ok={health.get("ok")!r}, schedules={"schedules" in capabilities}, '
                      f'runtime.ok={runtime.get("ok")!r}, backend_build={build!r}, repo_version={version!r}'
                  )
              except Exception as exc:
                  last_detail = str(exc)
              print(f'Esperando backend del mismo commit: {last_detail}')
              time.sleep(10)
          else:
              raise SystemExit(
                  'No se confirmó la paridad con el backend dentro de 10 minutos. '
                  f'Último estado: {last_detail}'
              )
          PY

      - name: Prepare GitHub Pages site
        env:
          INFORMTIT_API_BASE: ${{ vars.INFORMTIT_API_BASE }}
        run: |
          rm -rf _site
          mkdir -p _site
          cp -a static/. _site/
          touch _site/.nojekyll
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          site = Path('_site')
          index = site / 'index.html'
          text = index.read_text(encoding='utf-8')

          # GitHub Pages vive bajo /Informtit/. Los mismos archivos de static se
          # conservan; únicamente las URLs de recursos se vuelven relativas.
          text = re.sub(r'(href|src)="/', r'\1="./', text)

          # La única diferencia de arranque web es el puente hacia el backend.
          # No se cargan emuladores Firebase/localStorage: todas las funciones
          # pasan por el mismo Python que ejecuta npm start.
          bridge = (
              '  <script src="./web-config.js?v=2.0"></script>\n'
              '  <script src="./web-runtime.js?v=2.0"></script>\n'
          )
          app_script = '  <script src="./app.js?v=4.6"></script>\n'
          if 'web-runtime.js?v=2.0' not in text:
              if app_script not in text:
                  raise SystemExit('No se encontró app.js en static/index.html.')
              text = text.replace(app_script, bridge + app_script)

          index.write_text(text, encoding='utf-8')

          api_base = os.environ['INFORMTIT_API_BASE'].strip().rstrip('/')
          (site / 'web-config.js').write_text(
              'window.INFORMTIT_API_BASE = ' + json.dumps(api_base) + ';\n',
              encoding='utf-8',
          )
          PY

      - name: Verify Pages uses the shared runtime only
        run: |
          grep -q './web-config.js?v=2.0' _site/index.html
          grep -q './web-runtime.js?v=2.0' _site/index.html
          grep -q './app.js?v=4.6' _site/index.html
          if grep -q '<script src="./firebase-pages-runtime.js' _site/index.html; then exit 1; fi
          if grep -q '<script src="./firebase-report-pages-runtime.js' _site/index.html; then exit 1; fi
          if grep -q '<script src="./github-pages-guard.js' _site/index.html; then exit 1; fi
          if grep -q '<script src="./firebase-global-period-runtime.js' _site/index.html; then exit 1; fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
