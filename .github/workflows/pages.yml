name: Deploy Informtit to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate JavaScript
        run: |
          set -e
          for file in static/*.js; do
            node --check "$file"
          done

      - name: Smoke test Pages services
        run: |
          set -e
          node scripts/pages-smoke.mjs static/pages-browser-services.js static/pages-stability-runtime.js

      - name: Prepare GitHub Pages site
        run: |
          rm -rf _site
          cp -R static _site
          python - <<'PY'
          from pathlib import Path
          import re

          index = Path('_site/index.html')
          text = index.read_text(encoding='utf-8')

          text = re.sub(r'(?P<attr>href|src)="/(?!/)(?P<path>[^"]+)"', r'\g<attr>="./\g<path>"', text)

          remove_scripts = {
              'startup-guard.js', 'forms-hotfix.js', 'import-modality-guard-ui.js',
              'import-preview-client-guard.js', 'robust-import-ui.js', 'period-unified-ui.js',
              'students-period-ui.js', 'students-final-audit-ui.js', 'smart-reconciliation-ui.js',
              'coordinator-admin-ui.js', 'firebase-ui.js', 'desktop-ui-rescue.js',
              'completion-ui.js', 'independent-modules-ui.js', 'process-independent-ui.js',
              'process-ui-fixes.js', 'thesis-followup-ui.js', 'thesis-full-ui.js',
              'pvc-report-ui.js', 'workflow-ui-fixes.js', 'no-sections.js',
          }
          for script in remove_scripts:
              text = re.sub(rf'\s*<script[^>]+src="[^\"]*{re.escape(script)}[^\"]*"[^>]*></script>', '', text, flags=re.I)

          legacy_files = {
              'startup-guard.js', 'forms-hotfix.js', 'import-modality-guard-ui.js',
              'import-preview-client-guard.js', 'robust-import-ui.js', 'period-unified-ui.js',
              'students-period-ui.js', 'students-final-audit-ui.js', 'smart-reconciliation-ui.js',
              'coordinator-admin-ui.js', 'firebase-ui.js', 'desktop-ui-rescue.js',
              'firebase-pages-runtime.js', 'firebase-global-period-runtime.js',
              'firebase-global-period-final-ui.js', 'firebase-period-selector-ui.js',
              'firebase-schedule-runtime.js', 'firebase-schedule-completion-runtime.js',
              'firebase-active-report-runtime.js', 'firebase-nuclei-definitive-runtime.js',
              'firebase-nuclei-paste-runtime.js', 'firebase-nuclei-shared-runtime.js',
              'firebase-unified-data-runtime.js', 'firebase-dashboard-parity.js',
              'github-pages-guard.js', 'github-pages-runtime-fixes.js',
              'gitpages-parity-ui.js', 'completion-ui-v2.js', 'completion-ui.js',
              'independent-modules-ui.js', 'process-independent-ui.js', 'process-ui.js',
              'process-ui-fixes.js', 'thesis-followup-ui.js', 'thesis-full-ui.js',
              'pvc-report-ui.js', 'pvc-workspace-v2.js', 'workflow-ui-fixes.js',
              'workflow-ui.js', 'web-runtime.js', 'web-config.js', 'unified-period-ui.js',
              'nuclei-controls-hotfix.js', 'nuclei-paste-course-detection-fix.js',
              'no-sections.js', 'nuclei-campus-ui.js', 'nuclei-catalog-ui.js',
              'nuclei-clarity.js', 'nuclei-course-editor.js', 'nuclei-matching-ui.js',
              'nuclei-minimal-guard.js', 'nuclei-paste-ui.js', 'report-health-ui.js',
              'sections-template.js', 'sections-template.css', 'import-extra.css',
          }
          for filename in legacy_files:
              Path('_site', filename).unlink(missing_ok=True)

          app_tag = re.search(r'<script[^>]+src="\.\/app\.js[^\"]*"[^>]*></script>', text, flags=re.I)
          if not app_tag:
              raise SystemExit('No se encontró app.js en index.html')

          before_app = '''
          <script src="./sheets-api.js?v=4.0"></script>
          <script src="./firebase-report-pages-runtime.js?v=4.0"></script>
          <script src="./pages-shared-state-runtime.js?v=1.0"></script>
          <script src="./firebase-report-code-runtime.js?v=4.0"></script>
          <script src="./pages-data-runtime.js?v=3.0"></script>
          <script src="./nuclei-career-runtime.js?v=3.0"></script>
          <script src="./pages-browser-services.js?v=1.0"></script>
          '''
          text = text[:app_tag.start()] + before_app + text[app_tag.start():]

          after_app = '''
          <script src="./pages-period-selector-ui.js?v=4.0"></script>
          <script src="./report-modal-compact-ui.js?v=1.0"></script>
          <script src="./requirements-import-sheets-ui.js?v=3.0"></script>
          <script src="./results-import-ui.js?v=3.0"></script>
          <script src="./schedule-auto-completion-ui.js?v=3.0"></script>
          <script src="./nuclei-paste-definitive-ui.js?v=3.0"></script>
          <script src="./nuclei-population-ui.js?v=3.0"></script>
          <script src="./nuclei-organization.js?v=3.0"></script>
          <script src="./pvc-schedules-ui.js?v=3.0"></script>
          <script src="./report-health-sheets-ui.js?v=3.0"></script>
          <script src="./pvc-workspace-v3.js?v=3.0"></script>
          <script src="./pages-system-ui.js?v=3.0"></script>
          <script src="./pages-sections-ui.js?v=1.0"></script>
          <script src="./pages-processes-ui.js?v=1.0"></script>
          <script src="./pages-stability-runtime.js?v=1.0"></script>
          '''
          app_tag = re.search(r'<script[^>]+src="\.\/app\.js[^\"]*"[^>]*></script>', text, flags=re.I)
          text = text[:app_tag.end()] + after_app + text[app_tag.end():]

          index.write_text(text, encoding='utf-8')
          PY

      - name: Verify clean Pages bundle
        run: |
          set -e
          grep -q 'sheets-api.js' _site/index.html
          grep -q 'pages-shared-state-runtime.js' _site/index.html
          grep -q 'pages-data-runtime.js' _site/index.html
          grep -q 'pages-browser-services.js' _site/index.html
          grep -q 'pages-sections-ui.js' _site/index.html
          grep -q 'pages-processes-ui.js' _site/index.html
          grep -q 'pages-stability-runtime.js' _site/index.html
          grep -q 'report-modal-compact-ui.js' _site/index.html
          grep -q 'requirements-import-sheets-ui.js' _site/index.html
          grep -q 'pvc-workspace-v3.js' _site/index.html
          grep -q '/api/health' _site/pages-browser-services.js
          grep -q 'guardarInforme' _site/pages-shared-state-runtime.js
          grep -q 'guardarPeriodo' _site/pages-shared-state-runtime.js
          grep -q 'schedules/' _site/pages-processes-ui.js
          grep -q '/projects' _site/pages-processes-ui.js
          grep -q 'renderPagesSectionsState' _site/pages-sections-ui.js
          grep -q 'pdf-jobs' _site/pages-stability-runtime.js
          grep -q 'ERROR DE FUENTE' _site/pages-stability-runtime.js
          grep -q 'output_requirements_complete' _site/pages-stability-runtime.js

          for legacy in \
            coordinator-admin-ui.js import-preview-client-guard.js robust-import-ui.js \
            firebase-global-period-runtime.js firebase-pages-runtime.js firebase-schedule-runtime.js \
            firebase-period-selector-ui.js desktop-ui-rescue.js completion-ui.js \
            independent-modules-ui.js process-independent-ui.js process-ui-fixes.js \
            thesis-followup-ui.js thesis-full-ui.js pvc-report-ui.js workflow-ui-fixes.js no-sections.js; do
            ! grep -q "$legacy" _site/index.html
          done

          for legacy in \
            firebase-pages-runtime.js firebase-global-period-runtime.js github-pages-runtime-fixes.js \
            completion-ui.js completion-ui-v2.js independent-modules-ui.js process-independent-ui.js \
            process-ui.js process-ui-fixes.js thesis-followup-ui.js thesis-full-ui.js pvc-report-ui.js \
            pvc-workspace-v2.js workflow-ui-fixes.js workflow-ui.js web-runtime.js no-sections.js \
            nuclei-controls-hotfix.js nuclei-paste-course-detection-fix.js nuclei-campus-ui.js \
            nuclei-catalog-ui.js nuclei-clarity.js nuclei-course-editor.js nuclei-matching-ui.js \
            nuclei-minimal-guard.js nuclei-paste-ui.js report-health-ui.js sections-template.js; do
            test ! -e "_site/$legacy"
          done

          node --check _site/firebase-report-pages-runtime.js
          node --check _site/pages-shared-state-runtime.js
          node --check _site/firebase-report-code-runtime.js
          node --check _site/pages-data-runtime.js
          node --check _site/pages-browser-services.js
          node --check _site/pages-sections-ui.js
          node --check _site/pages-processes-ui.js
          node --check _site/pages-stability-runtime.js
          node --check _site/pages-period-selector-ui.js
          node --check _site/report-modal-compact-ui.js
          node --check _site/requirements-import-sheets-ui.js
          node --check _site/pvc-workspace-v3.js
          node --check _site/pages-system-ui.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
