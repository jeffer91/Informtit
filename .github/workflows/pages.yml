name: Deploy Informtit to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate source JavaScript
        run: |
          set -e
          for file in static/*.js; do node --check "$file"; done

      - name: Smoke test core Pages services
        run: |
          set -e
          node scripts/pages-smoke.mjs static/pages-browser-services.js static/pages-stability-runtime.js static/pages-document-pdf-runtime.js
          node scripts/report-create-controller-smoke.mjs static/report-create-controller.js
          node scripts/schedule-text-import-smoke.mjs static/schedule-text-import-ui.js

      - name: Prepare GitHub Pages site
        run: |
          set -e
          rm -rf _site
          cp -R static _site
          python scripts/build-pages.py _site
          python scripts/build-pages-data-integrity.py _site
          node scripts/results-import-smoke.mjs _site/results-import-ui.js
          node scripts/schedule-text-import-smoke.mjs _site/schedule-text-import-ui.js

      - name: Verify SVD 2.1 Pages bundle
        run: |
          set -e
          grep -q 'neon-data-runtime.js?v=1.5' _site/index.html
          grep -q 'results-import-ui.js?v=4.1' _site/index.html
          grep -q 'requirements-import-sheets-ui.js?v=4.4' _site/index.html
          grep -q 'pages-data-runtime.js?v=3.3' _site/index.html
          grep -q 'pages-stability-runtime.js?v=1.3' _site/index.html
          grep -q 'schedule-text-import-ui.js?v=1.0' _site/index.html
          grep -q 'period-validation-runtime.js?v=1.0' _site/index.html
          grep -q 'report-health-sheets-ui.js?v=4.0' _site/index.html
          grep -q 'pages-source-status-ui.js?v=1.3' _site/index.html

          grep -q 'allowAnonymous: true' _site/neon-data-runtime.js
          grep -q 'InformtitPublicAccess' _site/neon-data-runtime.js
          grep -q 'guardarTrabajoTitulacion' _site/neon-data-runtime.js
          grep -q 'assertNotThesis' _site/neon-data-runtime.js
          grep -q 'accumulated_grade' _site/neon-data-runtime.js
          grep -q "academic_status:'INACTIVO_FUENTE'" _site/neon-data-runtime.js
          ! grep -q 'window.InformtitSheets=' _site/neon-data-runtime.js
          ! grep -q 'initializeAuth();' _site/neon-data-runtime.js

          grep -q "standard:'SVD_2_1'" _site/pages-period-selector-ui.js
          grep -q 'SVD21_EMPTY_START' _site/pages-period-selector-ui.js
          grep -q 'Selecciona un período para continuar' _site/pages-period-selector-ui.js
          grep -q 'guardarPeriodo' _site/pages-period-selector-ui.js
          grep -q "if(!selectedPeriodId)return jsonResponse" _site/pages-shared-state-runtime.js

          grep -q "'SIN_DEFINIR'" _site/pages-data-runtime.js
          grep -q 'requirements_data_missing' _site/pages-data-runtime.js
          grep -q 'noncompliant_requirement_labels' _site/pages-data-runtime.js
          ! grep -q "nucleos(periodId).catch" _site/pages-data-runtime.js
          ! grep -q "complexivo(periodId).catch" _site/pages-data-runtime.js
          ! grep -q "trabajoTitulacion(periodId).catch" _site/pages-data-runtime.js

          grep -q 'duplicateIds' _site/requirements-import-sheets-ui.js
          grep -q 'Filas sin cédula' _site/requirements-import-sheets-ui.js
          grep -q 'Ausentes de la nueva base' _site/requirements-import-sheets-ui.js
          ! grep -q "estudiantes().catch" _site/requirements-import-sheets-ui.js
          grep -q 'windows-1252' _site/requirements-import-sheets-ui.js

          grep -q "const VERSION = '4.1.0'" _site/results-import-ui.js
          grep -q 'buildNucleusCatalog' _site/results-import-ui.js
          grep -q 'exactamente 4 Núcleos distintos' _site/results-import-ui.js
          grep -q 'accumulated_grade:item.acumulado' _site/results-import-ui.js

          grep -q 'type="date" class="table-input date-input" name="start_date"' _site/pages-processes-ui.js
          grep -q 'la fecha fin no puede ser anterior' _site/pages-processes-ui.js
          grep -q 'SISACAD_TRABAJO_TITULACION' _site/pages-processes-ui.js

          grep -q 'SCHEDULE_TEXT_IMPORT_V1' _site/schedule-text-import-ui.js
          grep -q 'Importar cronograma desde texto' _site/schedule-text-import-ui.js
          grep -q 'INDEPENDENT_COMPONENT_VALIDATION_V1' _site/period-validation-runtime.js
          grep -q "standard:'SVD_2_1_INDEPENDENT'" _site/period-validation-runtime.js
          grep -q 'REPORT_HEALTH_INDEPENDENT_V4' _site/report-health-sheets-ui.js
          grep -q 'Examen Complexivo ordinario' _site/report-health-sheets-ui.js
          grep -q 'Examen Complexivo supletorio' _site/report-health-sheets-ui.js

          ! grep -q 'Google Sheets' _site/pages-document-ui.js
          grep -q 'NEON_POSTGRESQL' _site/pages-stability-runtime.js
          grep -q 'Integridad de requisitos' _site/pages-stability-runtime.js
          grep -q 'BORRADOR · Documento con pendientes' _site/pages-document-pdf-runtime.js
          ! grep -q 'GOOGLE_SHEETS' _site/pages-document-pdf-runtime.js

          ! grep -q 'sheets-api.js' _site/index.html
          test ! -e _site/sheets-api.js
          for legacy in coordinator-admin-ui.js robust-import-ui.js firebase-pages-runtime.js firebase-global-period-runtime.js firebase-period-selector-ui.js desktop-ui-rescue.js no-sections.js pages-sections-ui.js; do
            ! grep -q "$legacy" _site/index.html
          done

          for file in _site/*.js; do node --check "$file"; done

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
